# nginx/nginx.conf — YOU_1_APP_SERVER
# Đặt tại thư mục nginx/nginx.conf trong repo YOU_1_APP_SERVER
#
# Vai trò (theo baseline Phase 12): Reverse Proxy + Load Balancer (tương lai) + TLS/SSL termination (staging/prod).
# Bản này là bản DEV — chưa có TLS/Certbot (thêm ở Phase 12 khi deploy staging/production thật).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # upstream block — để sẵn dạng này giúp mở rộng load-balance nhiều container Backend sau này
    # mà không cần đổi cấu trúc file, chỉ cần thêm dòng "server backend2:3000;" (xem Phase 12 mục 6)
    upstream backend_upstream {
        server backend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Giới hạn body size khớp với express.json({ limit: "1mb" }) ở app.js — tránh Nginx tự chặn trước ở ngưỡng khác
        client_max_body_size 1m;

        location /health {
            proxy_pass http://backend_upstream/health;
            access_log off;
        }

        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            return 404;
        }
    }

    # --- Khi lên staging/production (Phase 12) ---
    # 1. Thêm server block listen 443 ssl, cert Let's Encrypt (Certbot)
    # 2. Thêm server block listen 80 chỉ để redirect HTTP -> HTTPS
    # 3. server_name đổi thành domain thật (VD api.you-il.com)
}
